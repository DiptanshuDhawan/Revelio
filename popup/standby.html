<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revelio Standby Redesign v2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

    :root {
      --font-ui: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --color-clean: #22C55E;
      --color-flagged: #F59E0B;
      --color-blocked: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      background: #0B0F1D;
      border: 1px solid #1A2438;
      border-radius: 12px;
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      /* Remove default body margin to fit width exactly if placed in extension popup */
      margin: 0;
    }

    /* --- Header Bar --- */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0D1220;
      border-bottom: 1px solid #161F32;
      padding: 12px 16px;
      border-top-left-radius: 11px;
      border-top-right-radius: 11px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-tile {
      width: 28px;
      height: 28px;
      background: #111A30;
      border: 1px solid #1E2E48;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-tile svg {
      width: 20px;
      height: 20px;
      color: #4A7AAA;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 500;
      color: #C8D8E8;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #2E4060;
      line-height: 1.2;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 5px;
      background: rgba(34, 197, 94, 0.1);
      color: #22C55E;
      border: 1px solid rgba(34, 197, 94, 0.18);
      font-weight: 500;
    }

    .live-badge.error {
      background: rgba(239, 68, 68, 0.1);
      color: #EF4444;
      border-color: rgba(239, 68, 68, 0.18);
    }
    
    .live-badge.hidden {
      display: none;
    }

    .settings-btn {
      width: 26px;
      height: 26px;
      background: transparent;
      border: 1px solid #1A2438;
      border-radius: 6px;
      color: #3A5070;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .settings-btn:hover {
      background: #111A2E;
    }
    
    .settings-btn svg {
      width: 14px;
      height: 14px;
    }

    /* --- Hero Section --- */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 20px;
    }

    .hero-tile {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0F1828;
      border: 1px solid #1A2E48;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .hero-tile svg {
      width: 22px;
      height: 22px;
      color: #4A6A90;
    }

    .state-label {
      font-size: 16px;
      font-weight: 500;
      color: #C0D0E0;
      letter-spacing: -0.01em;
      margin-bottom: 5px;
    }

    .hint-text {
      font-size: 12px;
      color: #3E5570;
      text-align: center;
      line-height: 1.6;
      max-width: 220px;
    }

    /* --- Divider --- */
    .divider {
      height: 1px;
      background: #131C2E;
      margin: 0 16px;
    }

    /* --- Stats Section --- */
    .stats-section {
      padding: 16px 16px 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat-tile {
      background: #090D18;
      border: 1px solid #131C2E;
      border-radius: 8px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .stat-number {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 500;
      line-height: 1;
    }

    .stat-number.clean { color: var(--color-clean); }
    .stat-number.flagged { color: var(--color-flagged); }
    .stat-number.blocked { color: var(--color-blocked); }

    .stat-label {
      font-size: 10px;
      color: #2E4260;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* --- Model Chip --- */
    .model-chip-container {
      padding: 10px 16px 14px;
      display: flex;
      justify-content: center;
    }

    .model-pill {
      background: #090D18;
      border: 1px solid #131C2E;
      border-radius: 6px;
      padding: 5px 10px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    .model-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1E4A8A;
    }

    .model-text, .model-sep, .model-provider {
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .model-text { color: #3A5878; }
    .model-sep { color: #1E2E48; }
    .model-provider { color: #2A3E58; }

    /* --- Force Rescan Button --- */
    .action-container {
      padding: 0 16px 16px;
    }

    .rescan-btn {
      width: 100%;
      background: #0A1828;
      border: 1px solid #162438;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-family: var(--font-ui);
    }

    .rescan-btn-text {
      font-size: 12px;
      font-weight: 500;
      color: #5A80A0;
    }
    
    .rescan-btn svg {
      width: 13px;
      height: 13px;
      color: #5A80A0;
      stroke-width: 2.5;
    }

    .rescan-btn:hover:not(:disabled) {
      background: #0F2040;
      border-color: #1E3858;
    }
    
    .rescan-btn:hover:not(:disabled) .rescan-btn-text,
    .rescan-btn:hover:not(:disabled) svg {
      color: #88B0D0;
    }
    
    .rescan-btn:active:not(:disabled) {
      transform: scale(0.99);
    }
    
    .rescan-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Header bar -->
  <header class="header-bar">
    <div class="header-left">
      <div class="logo-tile">
        <!-- Shield-check icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">Revelio</div>
        <div class="brand-subtitle">Threat Intelligence</div>
      </div>
    </div>
    <div class="header-right">
      <div id="status-badge" class="live-badge">Live</div>
      <button class="settings-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="hero-section">
    <div class="hero-tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </div>
    <div class="state-label">Standing by</div>
    <div class="hint-text">Open an email in Gmail or Outlook to trigger a scan.</div>
  </main>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Session Stats -->
  <div class="stats-section">
    <div class="stat-tile">
      <div id="stat-clean" class="stat-number clean">0</div>
      <div class="stat-label">Clean</div>
    </div>
    <div class="stat-tile">
      <div id="stat-flagged" class="stat-number flagged">0</div>
      <div class="stat-label">Flagged</div>
    </div>
    <div class="stat-tile">
      <div id="stat-blocked" class="stat-number blocked">0</div>
      <div class="stat-label">Blocked</div>
    </div>
  </div>

  <!-- Model Chip -->
  <div class="model-chip-container">
    <div class="model-pill">
      <div class="model-dot"></div>
      <span id="model-name" class="model-text">unknown</span>
      <span class="model-sep">·</span>
      <span id="model-provider" class="model-provider">unknown</span>
    </div>
  </div>

  <!-- Action Button -->
  <div class="action-container">
    <button id="rescan-btn" class="rescan-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
      <span id="rescan-text" class="rescan-btn-text">Force rescan</span>
    </button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Setup Config mock if not running in extension
      window.revelioConfig = window.revelioConfig || {
        status: 'ready',
        modelId: 'gemma-4-31b',
        provider: 'openrouter'
      };

      // 1. Update Badge
      const badge = document.getElementById('status-badge');
      if (window.revelioConfig.status === 'ready') {
        badge.textContent = 'Live';
        badge.className = 'live-badge';
      } else if (window.revelioConfig.status === 'error') {
        badge.textContent = 'Error';
        badge.className = 'live-badge error';
      } else {
        badge.className = 'live-badge hidden';
      }

      // 2. Update Model Identifier
      const modelNameEl = document.getElementById('model-name');
      const modelProviderEl = document.getElementById('model-provider');
      
      modelNameEl.textContent = window.revelioConfig.modelId || 'unknown';
      modelProviderEl.textContent = window.revelioConfig.provider || 'unknown';

      // 3. Populate Stats
      const updateStats = (stats) => {
        document.getElementById('stat-clean').textContent = stats.clean || 0;
        document.getElementById('stat-flagged').textContent = stats.flagged || 0;
        document.getElementById('stat-blocked').textContent = stats.blocked || 0;
      };

      if (window.chrome && chrome.storage && chrome.storage.local) {
        chrome.storage.local.get('revelio_stats', (data) => {
          updateStats(data.revelio_stats || { clean: 0, flagged: 0, blocked: 0 });
        });

        chrome.storage.onChanged.addListener((changes, namespace) => {
          if (namespace === 'local' && changes.revelio_stats) {
            updateStats(changes.revelio_stats.newValue || { clean: 0, flagged: 0, blocked: 0 });
          }
        });
      }

      // 4. Force Rescan Event
      const rescanBtn = document.getElementById('rescan-btn');
      const rescanText = document.getElementById('rescan-text');
      
      rescanBtn.addEventListener('click', () => {
        // Dispatch custom event
        const event = new CustomEvent('revelio_force_rescan');
        window.dispatchEvent(event);
        
        // UI Feedback
        rescanText.textContent = 'Rescanning…';
        rescanBtn.disabled = true;
        
        setTimeout(() => {
          rescanText.textContent = 'Force rescan';
          rescanBtn.disabled = false;
        }, 1500);
      });
    });
  </script>
</body>
</html>
